{{- if .Values.ca.enabled }}
{{- $host := include "pqcsuite.caHost" . }}
{{- $acmeUrl := .Values.ca.acme.baseUrl | default (printf "http://%s:%d" $host (int .Values.ca.acme.port)) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ca
  labels: {{- include "pqcsuite.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ca
  ports:
    - name: crl
      port: {{ .Values.ca.crl.port }}
    {{- if .Values.ca.est.enabled }}
    - name: est
      port: {{ .Values.ca.est.port }}
    {{- end }}
    {{- if .Values.ca.acme.enabled }}
    - name: acme
      port: {{ .Values.ca.acme.port }}
    {{- end }}
    {{- if .Values.ca.console.enabled }}
    - name: console
      port: {{ .Values.ca.console.port }}
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-ca
  labels: {{- include "pqcsuite.labels" . | nindent 4 }}
    app.kubernetes.io/component: ca
spec:
  replicas: 1                  # one writer: the CA folder is the source of truth
  serviceName: {{ .Release.Name }}-ca
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ca
  template:
    metadata:
      labels: {{- include "pqcsuite.labels" . | nindent 8 }}
        app.kubernetes.io/component: ca
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init
          image: {{ include "pqcsuite.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["sh", "-ec"]
          args:
            - |
              test -f /data/pki/ca.crt || pqcsuite ca init --dir /data/pki --name "$CA_NAME" --algorithm {{ .Values.ca.algorithm }} {{ if .Values.ca.passphraseSecret }}--encrypt{{ end }}
              {{- if .Values.ca.est.enabled }}
              test -f /data/est/chain.pem || pqcsuite ca issue --dir /data/pki server {{ $host }} --san {{ .Release.Name }}-ca --out /data/est
              {{- end }}
              test -f /data/pki/crl.pem || pqcsuite ca crl --dir /data/pki
          env:
            - name: CA_NAME
              value: {{ .Values.ca.name | quote }}
            {{- include "pqcsuite.caEnv" . | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: crl
          image: {{ include "pqcsuite.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["ca", "publish", "--dir", "/data/pki", "--listen", "0.0.0.0:{{ .Values.ca.crl.port }}"]
          ports:
            - {name: crl, containerPort: {{ .Values.ca.crl.port }}}
          readinessProbe:
            httpGet: {path: /crl.pem, port: crl}
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
          resources: {{- toYaml .Values.ca.resources | nindent 12 }}
        {{- if .Values.ca.est.enabled }}
        - name: est
          image: {{ include "pqcsuite.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["ca", "serve", "--dir", "/data/pki", "--listen", "0.0.0.0:{{ .Values.ca.est.port }}", "--cert", "/data/est/chain.pem", "--key", "/data/est/key.pem"]
          env: {{- include "pqcsuite.caEnv" . | nindent 12 }}
          ports:
            - {name: est, containerPort: {{ .Values.ca.est.port }}}
          readinessProbe:
            tcpSocket: {port: est}
          volumeMounts:
            - {name: data, mountPath: /data}
          resources: {{- toYaml .Values.ca.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.ca.acme.enabled }}
        - name: acme
          image: {{ include "pqcsuite.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - ca
            - acme
            - --dir=/data/pki
            - --listen=0.0.0.0:{{ .Values.ca.acme.port }}
            - --base-url={{ $acmeUrl }}
            - --http-port={{ .Values.ca.acme.httpPort }}
            {{- if .Values.ca.acme.requireEab }}
            - --require-eab
            {{- end }}
            {{- range .Values.ca.acme.allow }}
            - --allow={{ . }}
            {{- end }}
          env: {{- include "pqcsuite.caEnv" . | nindent 12 }}
          ports:
            - {name: acme, containerPort: {{ .Values.ca.acme.port }}}
          readinessProbe:
            httpGet: {path: /directory, port: acme}
          volumeMounts:
            - {name: data, mountPath: /data}
          resources: {{- toYaml .Values.ca.resources | nindent 12 }}
        {{- end }}
        - name: maintain
          image: {{ include "pqcsuite.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["sh", "-c"]
          args:
            - while true; do pqcsuite ca maintain --dir /data/pki --renew-within {{ .Values.ca.maintain.renewWithinDays }} --crl-days {{ .Values.ca.maintain.crlDays }}; sleep {{ .Values.ca.maintain.everySeconds }}; done
          env: {{- include "pqcsuite.caEnv" . | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
        {{- if .Values.ca.console.enabled }}
        - name: console
          image: {{ include "pqcsuite.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          workingDir: /data
          args: ["console", "--ca", "/data/pki", "--listen", "0.0.0.0:{{ .Values.ca.console.port }}"{{ if .Values.edge.enabled }}, "--edge", "http://{{ .Release.Name }}-edge.{{ .Release.Namespace }}.svc:{{ .Values.edge.metricsPort }}"{{ end }}]
          env:
            {{- include "pqcsuite.caEnv" . | nindent 12 }}
            - name: PQCSUITE_CONSOLE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "ca.console.tokenSecret is required when the console is enabled" .Values.ca.console.tokenSecret }}
                  key: token
          ports:
            - {name: console, containerPort: {{ .Values.ca.console.port }}}
          volumeMounts:
            - {name: data, mountPath: /data}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.ca.storage.storageClass }}
        storageClassName: {{ .Values.ca.storage.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.ca.storage.size }}
{{- end }}
