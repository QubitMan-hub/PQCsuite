{{- if .Values.edge.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-edge
  labels: {{- include "pqcsuite.labels" . | nindent 4 }}
data:
  edge.toml: |
    [metrics]
    listen = "0.0.0.0:{{ .Values.edge.metricsPort }}"
    {{- range .Values.edge.routes }}

    [[edge]]
    name = {{ .name | quote }}
    mode = "terminate"
    listen = "0.0.0.0:{{ .port }}"
    target = {{ .target | quote }}
    policy = {{ $.Values.edge.policy | quote }}
    cert = "/etc/pqcsuite/tls/chain.pem"
    key = "/etc/pqcsuite/tls/key.pem"
    ca = "/etc/pqcsuite/tls/ca.crt"
    {{- if .requireClientCert }}
    require_client_cert = true
    crl = "/etc/pqcsuite/tls/crl.pem"
    {{- end }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-edge
  labels: {{- include "pqcsuite.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  replicas: {{ .Values.edge.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: edge
  template:
    metadata:
      labels: {{- include "pqcsuite.labels" . | nindent 8 }}
        app.kubernetes.io/component: edge
      annotations:
        checksum/config: {{ toYaml .Values.edge | sha256sum | trunc 16 }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: edge
          image: {{ include "pqcsuite.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["edge", "--config", "/etc/pqcsuite/edge.toml"]
          ports:
            {{- range .Values.edge.routes }}
            - {name: {{ .name | trunc 15 | quote }}, containerPort: {{ .port }}}
            {{- end }}
            - {name: metrics, containerPort: {{ .Values.edge.metricsPort }}}
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 20
          volumeMounts:
            - {name: config, mountPath: /etc/pqcsuite/edge.toml, subPath: edge.toml}
            - {name: tls, mountPath: /etc/pqcsuite/tls, readOnly: true}
          resources: {{- toYaml .Values.edge.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-edge
        - name: tls
          secret:
            secretName: {{ .Values.edge.certSecret }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-edge
  labels: {{- include "pqcsuite.labels" . | nindent 4 }}
spec:
  type: {{ .Values.edge.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: edge
  ports:
    {{- range .Values.edge.routes }}
    - {name: {{ .name | trunc 15 | quote }}, port: {{ .port }}}
    {{- end }}
    - {name: metrics, port: {{ $.Values.edge.metricsPort }}}
{{- end }}
