<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acxelin TLS</title>
<style>
/*SHELL*/
.inline-acts{flex-wrap:nowrap;gap:6px}
td:last-child{padding-right:16px}
@media (max-width:560px){.inline-acts{flex-wrap:wrap}}
.edge{border-top:1px solid var(--rule);padding:14px 0}
.edge h3{font:500 15px var(--display);margin:0 0 4px;color:var(--ink)}
.copyable{display:grid;gap:6px;justify-items:start;min-width:0}.copyable pre{margin:0;max-width:100%;overflow-x:auto;white-space:pre;font-size:12.5px}
</style>
</head>
<body>
<main>
<header class="brandbar"><div class="logo"><!--LOGO--></div><span class="product">Acxelin TLS</span><small>Local console. Only this computer can open it.</small></header>
<p class="msg" id="msg" role="alert"></p>
<div id="app" aria-live="polite"><p class="lede">Opening the console…</p></div>
</main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, ""); else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const k of kids.flat()) el.append(k instanceof Node ? k : document.createTextNode(k ?? ""));
  return el;
};
const say = (text) => { const m = $("#msg"); m.textContent = text || ""; if (text) m.scrollIntoView({block: "center", behavior: "smooth"}); };
const quote = (p) => /[\s"]/.test(p) ? '"' + p + '"' : p;
function copyable(text) {
  const b = h("button", {class: "btn quiet small", type: "button"}, "Copy command");
  b.addEventListener("click", async () => { try { await navigator.clipboard.writeText(text); b.textContent = "Copied"; } catch (e) { b.textContent = "Select and copy"; } });
  return h("div", {class: "copyable"}, h("pre", {tabindex: "0", "aria-label": "Command"}, h("code", {}, text)), b);
}
const state = {tab: "certs", status: null};
const call = async (path, body) => { try { say(""); return await acx.api(path, body); } catch (e) { say(e.status === 401 ? "This session has ended. Run the console command again to open a new one." : e.message); throw e; } };
const day = (t) => t ? t.slice(0, 10) : "";
const field = (id, label, input, hint) => [h("label", {for: id}, label), input, hint ? h("p", {class: "legend"}, ...acxText(hint)) : ""];

function signedOut() {
  $("#app").replaceChildren(h("div", {class: "narrow"}, h("h1", {}, "This link has expired"),
    h("p", {class: "lede"}, "Each launch link works once. In a terminal, run ", h("code", {class: "cmd"}, "acxelin-tls console"), " to open a new one."),
    h("p", {class: "lede"}, "On a remote server, forward the port with SSH, then run ", h("code", {class: "cmd"}, "acxelin-tls console link"), " in that session.")));
}

function createCa() {
  const name = h("input", {type: "text", id: "ca-name", autocomplete: "off", placeholder: "Example Root CA", required: true});
  const pass = h("input", {type: "password", id: "ca-pass", autocomplete: "new-password"});
  const again = h("input", {type: "password", id: "ca-pass2", autocomplete: "new-password"});
  const go = async () => {
    if (pass.value !== again.value) { say("The two passphrases are different. Type the same passphrase in both boxes."); again.select(); return; }
    try { await call("ca/create", {name: name.value, passphrase: pass.value || null}); await load(); } catch (e) {}
  };
  $("#app").replaceChildren(h("div", {class: "narrow"}, h("h1", {}, "Create your certificate authority"),
    h("p", {class: "lede"}, "The certificate authority signs the certificates your services and users present. It uses ML-DSA-87, a post-quantum signature."),
    ...field("ca-name", "Name", name), ...field("ca-pass", "Passphrase (recommended)", pass, "Encrypts the CA key. The console keeps it in memory only, so you enter it again after a restart. Without one, the key file is stored unencrypted."),
    ...field("ca-pass2", "Repeat passphrase", again),
    h("div", {class: "row", style: "margin-top:18px"}, h("button", {class: "btn", onclick: go}, "Create certificate authority"))));
  name.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  name.focus();
}

function unlock() {
  const pass = h("input", {type: "password", id: "unlock-pass", autocomplete: "current-password"});
  const go = async () => { try { await call("ca/unlock", {passphrase: pass.value}); await load(); } catch (e) { pass.select(); } };
  $("#app").replaceChildren(h("div", {class: "narrow"}, h("h1", {}, "Unlock the certificate authority"),
    h("p", {class: "lede"}, "The CA key for " + state.status.name + " is encrypted. Enter its passphrase to issue and revoke certificates."),
    ...field("unlock-pass", "Passphrase", pass), h("div", {class: "row", style: "margin-top:18px"}, h("button", {class: "btn", onclick: go}, "Unlock"))));
  pass.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  pass.focus();
}

function shell() {
  const tab = (id, label) => h("button", {role: "tab", id: "tab-" + id, "aria-selected": String(state.tab === id), "aria-controls": "panel", onclick: () => { state.tab = id; shell(); }}, label);
  $("#app").replaceChildren(h("div", {class: "tabs", role: "tablist"}, tab("certs", "Certificates"), tab("edges", "Edges"), tab("health", "Health")), h("div", {id: "panel", role: "tabpanel", "aria-labelledby": "tab-" + state.tab}));
  ({certs: certsView, edges: edgesView, health: healthView})[state.tab]();
}

// ---- certificates

const factSpans = (s) => [s.algorithm, s.counts.valid + " valid", s.counts.revoked + " revoked", s.counts.expiring + " expiring within 30 days"].map((t) => h("span", {}, t));
function crlLine(s) {
  if (!s.crl) return "No revocation list yet.";
  return "Revocation list valid for " + Math.max(0, Math.floor(s.crl.days_left)) + " more days (until " + day(s.crl.next_update) + ").";
}

async function certsView() {
  const s = state.status, panel = $("#panel");
  const kind = h("select", {id: "kind"}, [["server", "Server"], ["client", "Client"]].map(([v, l]) => h("option", {value: v}, l)));
  const cn = h("input", {type: "text", id: "cn", autocomplete: "off", placeholder: "web.example.com"});
  const names = h("textarea", {id: "names", spellcheck: "false", placeholder: "api.example.com\n10.0.0.5"});
  const days = h("input", {type: "text", id: "days", value: "397", inputmode: "numeric"});
  const result = h("div", {id: "issued", "aria-live": "polite"});
  const issue = async (ev) => {
    ev.preventDefault();
    try {
      const r = await call("certificates/issue", {kind: kind.value, common_name: cn.value, names: names.value, days: Number(days.value)});
      const next = r.kind === "server" ? [h("p", {style: "margin:12px 0 6px"}, "To put it in front of a service on this computer (change the ports to yours):"),
        copyable("acxelin-tls edge --listen 0.0.0.0:8443 --target 127.0.0.1:8080 --cert " + quote(r.chain) + " --key " + quote(r.key))]
        : [h("p", {style: "margin:12px 0 0"}, "Give these two files to the client, or download them from the list.")];
      result.replaceChildren(h("div", {class: "result"}, h("p", {class: "ok-msg"}, "Issued " + r.common_name + "."),
        h("p", {style: "margin:0"}, "Certificate: ", h("code", {}, r.chain)), h("p", {style: "margin:0"}, "Key: ", h("code", {}, r.key)), ...next));
      cn.value = ""; names.value = "";
      await refreshCerts();
    } catch (e) {}
  };
  const refresh = h("button", {class: "btn quiet small", id: "crl-refresh", onclick: async () => { try { await call("crl/refresh", {}); await reload(); } catch (e) {} }}, "Refresh revocation list");
  const maintain = h("button", {class: "btn quiet small", id: "maintain", onclick: async () => { try { const r = await call("certificates/maintain", {}); say(""); await refreshCerts(); $("#crl-line").textContent = crlLine(state.status) + (r.renewed.length ? " Renewed: " + r.renewed.join(", ") + "." : " Nothing needed renewing."); } catch (e) {} }}, "Run maintenance");
  const form = h("form", {onsubmit: issue}, h("h2", {}, "Issue a certificate"), ...field("kind", "Kind", kind), ...field("cn", "Name", cn, "The name the certificate is for, such as web.example.com."),
    ...field("names", "Other names (one per line)", names), ...field("days", "Valid for (days)", days), h("div", {class: "row", style: "margin-top:16px"}, h("button", {class: "btn", type: "submit"}, "Issue certificate")), result);
  const list = h("div", {id: "cert-list"});
  panel.replaceChildren(h("h1", {}, s.name), h("div", {class: "facts", id: "facts"}, ...factSpans(s)),
    h("p", {class: "state", id: "crl-line", style: "margin:6px 0 10px"}, crlLine(s)), h("div", {class: "row", style: "margin:0 0 24px"}, refresh, maintain), h("div", {class: "split"}, form, list));
  await refreshCerts();
}
async function reload() { state.status = await call("status"); const l = $("#crl-line"), f = $("#facts"); if (l) l.textContent = crlLine(state.status); if (f) f.replaceChildren(...factSpans(state.status)); }
async function refreshCerts() {
  await reload();
  const out = $("#cert-list");
  if (!out) return;
  let data; try { data = await call("certificates"); } catch (e) { return; }
  const rows = data.certificates.slice().reverse().map((c) => {
    const acts = h("div", {class: "row inline-acts"});
    if (c.has_files) acts.append(fileButton(c, false), ...(c.status === "valid" ? [fileButton(c, true), renewButton(c)] : []));
    if (c.status === "valid") acts.append(revokeButton(c));
    const state = c.status !== "valid" ? "Revoked" : c.renewed ? "Renewed" : "Valid";
    return h("tr", {}, h("td", {class: "nw"}, c.common_name), h("td", {class: "nw"}, (c.kind === "server" ? "Server" : "Client") + " · " + c.algorithm), h("td", {class: "num"}, day(c.not_after)), h("td", {}, h("span", {class: "pill " + (state === "Valid" ? "ok" : state === "Renewed" ? "mute" : "bad")}, state)), h("td", {}, acts));
  });
  out.replaceChildren(h("h2", {}, "Issued certificates"), data.certificates.length ? h("div", {class: "scroll", tabindex: "0", role: "region", "aria-label": "Table, scrolls sideways"}, h("table", {}, h("thead", {}, h("tr", {}, ["Name", "Type", "Expires", "Status", "Actions"].map((c) => h("th", {}, c)))), h("tbody", {}, rows)))
    : h("p", {class: "empty"}, "Nothing issued yet. Use Issue a certificate to make your first one."),
    h("p", {class: "legend"}, "Download gives the certificate, its chain and the CA certificate. The private key is included only when you choose With key; every download is recorded."),
    activityList(state.status.activity || []));
}
function fileButton(c, withKey) {
  const label = withKey ? "Download with key" : "Download";
  return h("button", {class: "btn quiet small", "aria-label": label + " " + c.common_name, onclick: async () => { try { say(""); await acx.download("certificates/download", {serial: c.serial, key: withKey}); await reload(); paintActivity(); } catch (e) { say(e.message); } }}, withKey ? "With key" : label);
}
function renewButton(c) {
  return h("button", {class: "btn quiet small", "aria-label": "Renew " + c.common_name, onclick: async () => { try { await call("certificates/renew", {serial: c.serial}); await refreshCerts(); } catch (e) {} }}, "Renew");
}
const ACTIONS = {issue: "Issued", renew: "Renewed", revoke: "Revoked", download: "Downloaded", maintain: "Maintenance", test: "Tested a connection"};
function activityList(items) {
  return h("div", {id: "activity", style: "margin-top:26px"}, h("h2", {}, "Recent activity"), items.length ? h("ul", {class: "acts"}, items.map((a) => h("li", {}, h("span", {class: "mute"}, (a.time || "").replace("T", " ").replace("Z", " UTC")), " ",
    (ACTIONS[a.action] || a.action) + (a.common_name ? " " + a.common_name : a.target ? " " + a.target : "") + (a.action === "download" && a.key ? " (with key)" : "")))) : h("p", {class: "empty"}, "Nothing yet."));
}
async function paintActivity() { const el = $("#activity"); if (el) el.replaceWith(activityList(state.status.activity || [])); }
function revokeButton(c) {
  const b = h("button", {class: "btn quiet small", "aria-label": "Revoke " + c.common_name}, "Revoke");
  let armed = false, timer;
  b.addEventListener("click", async () => {
    const set = (text) => { b.textContent = text; b.setAttribute("aria-label", text + " " + c.common_name); b.className = "btn small " + (armed ? "danger" : "quiet"); };
    if (!armed) { armed = true; set("Confirm revoke"); timer = setTimeout(() => { armed = false; set("Revoke"); }, 6000); return; }
    clearTimeout(timer);
    try { await call("certificates/revoke", {serial: c.serial, reason: "unspecified"}); await refreshCerts(); } catch (e) { armed = false; set("Revoke"); }
  });
  return b;
}

// ---- edges

async function edgesView() {
  const panel = $("#panel");
  const url = h("input", {type: "text", id: "edge-url", placeholder: "http://127.0.0.1:9100", autocomplete: "off"});
  const add = async () => { try { await call("edges/add", {url: url.value}); url.value = ""; await paintEdges(); } catch (e) {} };
  const target = h("input", {type: "text", id: "t-target", placeholder: "127.0.0.1:8443", autocomplete: "off"});
  const sname = h("input", {type: "text", id: "t-name", placeholder: "web.example.com", autocomplete: "off"});
  const pol = h("select", {id: "t-policy"}, [["strict", "Post-quantum only (strict)"], ["transition", "Also classical (transition)"], ["cnsa2", "CNSA 2.0"]].map(([v, l]) => h("option", {value: v}, l)));
  const client = h("select", {id: "t-client"}, h("option", {value: ""}, "None"));
  call("certificates").then((d) => d.certificates.filter((c) => c.kind === "client" && c.has_files).forEach((c) => client.append(h("option", {value: c.serial}, c.common_name + (c.status === "valid" ? "" : " (revoked)"))))).catch(() => {});
  const out = h("div", {id: "t-result", "aria-live": "polite"});
  const kv = (pairs) => h("dl", {class: "kv"}, pairs.filter(([, v]) => v).flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, v)]));
  const test = async (ev) => {
    ev.preventDefault();
    try {
      const r = await call("edges/test", {target: target.value, server_name: sname.value || null, policy: pol.value, client: client.value || null});
      const parts = [h("p", {class: r.ok ? "ok-msg" : "bad"}, r.ok ? (r.quantum_safe ? "Connected, quantum-safe." : "Connected, but not quantum-safe.") : "Not connected.")];
      if (r.error) parts.push(h("p", {}, r.error));
      if (r.group) parts.push(kv([["Key exchange", r.group], ["Certificate key", r.peer_key], ["Cipher", r.cipher], ["Protocol", r.version]]));
      if (r.client_status === "revoked") parts.push(h("p", {}, "The client certificate you chose is revoked."));
      if (r.offers) parts.push(h("p", {class: "legend"}, "With no checks, the server offers " + r.offers.group + " and a " + (r.offers.peer_key || "unknown") + " certificate. If that looks right, it trusts or uses a different certificate authority."));
      out.replaceChildren(h("div", {class: "result"}, ...parts));
    } catch (e) { out.replaceChildren(); }
  };
  panel.replaceChildren(h("h1", {}, "Edges"), h("p", {class: "lede"}, "Add the metrics address of each running edge (its ", h("code", {}, "--metrics"), " option) to see its policy and negotiated key exchanges."),
    h("div", {class: "split"}, h("div", {}, h("h2", {}, "Running edges"),
      ...field("edge-url", "Edge metrics address", url), h("div", {class: "row", style: "margin-top:12px"}, h("button", {class: "btn", onclick: add}, "Add edge")), h("div", {id: "edge-list", style: "margin-top:22px"})),
    h("form", {onsubmit: test}, h("h2", {}, "Test a connection"), h("p", {class: "lede"}, "Connect to an edge as a client that trusts your certificate authority."),
      ...field("t-target", "Host and port", target), ...field("t-name", "Certificate name (if different from the host)", sname), ...field("t-policy", "Client policy", pol), ...field("t-client", "Client certificate (for mutual TLS)", client),
      h("div", {class: "row", style: "margin-top:16px"}, h("button", {class: "btn", type: "submit"}, "Test connection")), out)));
  await paintEdges();
}
async function paintEdges() {
  const out = $("#edge-list");
  if (!out) return;
  let data; try { data = await call("edges"); } catch (e) { return; }
  if (!data.edges.length) { out.replaceChildren(h("p", {class: "empty"}, "No edges added yet.")); return; }
  out.replaceChildren(...data.edges.map((e) => {
    const rm = h("button", {class: "btn quiet small", "aria-label": "Remove " + e.url, onclick: async () => { try { await call("edges/remove", {url: e.url}); await paintEdges(); } catch (x) {} }}, "Remove");
    const body = e.error ? [h("p", {class: "bad"}, e.error)] : e.routes.map((s) => h("div", {}, h("p", {style: "margin:0"}, h("strong", {}, s.name), " · policy ", s.policy, " · ", String(s.active || 0), " active"),
      h("p", {class: "legend", style: "margin:0"}, s.handshakes ? s.quantum_safe + " of " + s.handshakes + " handshakes quantum-safe" + (s.handshake_failed ? " · " + s.handshake_failed + " refused" : "") : "No handshakes yet")));
    return h("div", {class: "edge"}, h("div", {class: "row", style: "justify-content:space-between"}, h("h3", {}, e.url), rm), ...body);
  }));
}

// ---- health

async function healthView() {
  const panel = $("#panel");
  const out = h("div", {id: "health-list"});
  const run = async () => {
    let d; try { d = await call("health"); } catch (e) { return; }
    const tone = {ok: "ok", warn: "warn", fail: "bad"}, label = {ok: "OK", warn: "Warning", fail: "Problem"};
    const acts = d.checks.some((c) => c.action);
    out.replaceChildren(h("div", {class: "scroll", tabindex: "0", role: "region", "aria-label": "Checks, scrolls sideways"}, h("table", {}, h("thead", {}, h("tr", {}, ["Result", "Check", ...(acts ? ["What to do"] : [])].map((c) => h("th", {}, c)))),
      h("tbody", {}, d.checks.map((c) => h("tr", {}, h("td", {}, h("span", {class: "pill " + tone[c.level]}, label[c.level])), h("td", {}, ...acxText(c.message)), acts ? h("td", {}, ...acxText(c.action)) : ""))))));
  };
  panel.replaceChildren(h("h1", {}, "Health"), h("p", {class: "lede"}, "Whether this computer can run Acxelin TLS, and whether your certificate authority is in good shape."), h("div", {class: "row", style: "margin-bottom:18px"}, h("button", {class: "btn quiet", id: "recheck", onclick: run}, "Check again")), out);
  await run();
}

async function load() {
  try { state.status = await call("status"); } catch (e) { return signedOut(); }
  if (!state.status.configured) return createCa();
  if (state.status.encrypted && !state.status.unlocked) return unlock();
  shell();
}
acx.start().then((ok) => (ok ? load() : signedOut()));
</script>
</html>
