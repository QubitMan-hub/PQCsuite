# Repository-wide tool settings only; each product and core is its own package with its own pyproject.toml.

[tool.pytest.ini_options]
# the Readiness corpus is deliberately weak code to scan, never tests to run
norecursedirs = ["corpus", ".*", "build", "dist", "*.egg", "venv", "node_modules"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["products/readiness/bench/corpus", "products/readiness/examples/payments-api"]

[tool.ruff.lint]
ignore = ["E401", "E702", "E731", "E741"]
