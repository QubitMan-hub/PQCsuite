[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqcsuite"
version = "0.2.2"
description = "Post-quantum TLS 1.3 and mTLS, IPsec VPN, Vault and Readiness assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=49"]
authors = [{name = "Acxelin Quantum"}]

[project.urls]
Homepage = "https://qubitman-hub.github.io/PQCsuite/"
Source = "https://github.com/QubitMan-hub/PQCsuite"
Changelog = "https://github.com/QubitMan-hub/PQCsuite/blob/main/CHANGELOG.md"

[project.optional-dependencies]
vpn = ["vici>=6.0"]
kms = ["boto3>=1.35"]
test = ["acme>=4", "certbot>=4; sys_platform != 'win32'", "hypothesis>=6.100"]

[project.scripts]
pqcsuite = "pqcsuite.cli:main"

[tool.setuptools.packages.find]
include = ["pqcsuite*"]

[tool.setuptools.package-data]
"pqcsuite.console" = ["console.html"]

[tool.pytest.ini_options]
testpaths = ["tests", "wolf-pack/tests"]
pythonpath = ["wolf-pack"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["wolf-pack/bench/corpus", "wolf-pack/site/demo", "wolf-pack/eval/heldout/repos", "examples/wolfpack-sample/payments-api"]

[tool.ruff.lint]
ignore = ["E401", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"wolf-pack/eval/heldout/heldout.py" = ["E402"]
"wolf-pack/tests/test_heldout.py" = ["E402"]
