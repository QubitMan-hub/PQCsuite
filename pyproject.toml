[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqcsuite"
version = "0.1.0"
description = "Post-quantum TLS 1.3 and mTLS, IPsec VPN, Vault and Readiness assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=49"]

[project.optional-dependencies]
vpn = ["vici>=6.0"]
kms = ["boto3>=1.35"]
test = ["acme>=4", "certbot>=4; sys_platform != 'win32'"]

[project.scripts]
pqcsuite = "pqcsuite.cli:main"

[tool.setuptools.packages.find]
include = ["pqcsuite*"]

[tool.setuptools.package-data]
"pqcsuite.console" = ["console.html"]
