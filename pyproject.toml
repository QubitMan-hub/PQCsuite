[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqcsuite"
version = "0.4.3"
description = "Post-quantum TLS 1.3 and mTLS, VPN, Vault and Readiness assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=49", "acxelin-core>=1,<2", "acxelin-tls>=1,<2"]  # until VPN and Vault move to their products
authors = [{name = "Acxelin Quantum"}]

[project.urls]
Homepage = "https://qubitman-hub.github.io/PQCsuite/"
Source = "https://github.com/QubitMan-hub/PQCsuite"
Changelog = "https://github.com/QubitMan-hub/PQCsuite/blob/main/CHANGELOG.md"

[project.optional-dependencies]
scan = ["acxelin-readiness>=1,<2"]
scan-web = ["acxelin-readiness[crawler]>=1,<2"]
vpn = ["vici>=6.0"]
desktop = ["pystray>=0.19.5", "pillow>=11"]
kms = ["boto3>=1.35"]
test = ["coverage>=7.6", "hypothesis>=6.100", "pytest>=9"]
integration = ["acme>=4", "certbot>=4; sys_platform != 'win32'"]  # the ACME tests against certbot's client

[project.scripts]
pqcsuite = "pqcsuite.cli:main"

[tool.setuptools.packages.find]
include = ["pqcsuite*"]

[tool.setuptools.package-data]
"pqcsuite.console" = ["console.html"]
"pqcsuite.vpn" = ["app.html"]

[tool.distutils.build]
build_base = "dist/.build"  # keeps `pip wheel .` from leaving build/ in the source tree

[tool.pytest.ini_options]
testpaths = ["tests"]
# the Readiness corpus is deliberately weak code to scan, never tests to run
norecursedirs = ["corpus", ".*", "build", "dist", "*.egg", "venv", "node_modules"]

[tool.coverage.run]
source = ["pqcsuite"]

[tool.coverage.report]
fail_under = 74  # VPN and Vault only, as measured in the scenarios job; TLS and Readiness moved to products/ with their own tests

[tool.ruff]
target-version = "py311"
extend-exclude = ["products/readiness/bench/corpus", "products/readiness/examples/payments-api"]

[tool.ruff.lint]
ignore = ["E401", "E702", "E731", "E741"]

