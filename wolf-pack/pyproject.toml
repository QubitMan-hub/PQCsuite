[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wolfpack-cbom"
version = "1.3.0"
description = "Cryptographic inventory (CycloneDX 1.6 CBOM) and post-quantum migration planner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
crawler = ["tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.23,<0.26", "tree-sitter-typescript>=0.23,<0.24"]
dev = ["jsonschema>=4.18", "referencing>=0.30", "pytest>=9"]

[project.scripts]
wolfpack = "wolfpack.cli:main"

[tool.setuptools.packages.find]
include = ["wolfpack*"]

[tool.setuptools.package-data]
"wolfpack" = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["corpus", ".*", "build", "dist", "*.egg", "venv", "node_modules"]
