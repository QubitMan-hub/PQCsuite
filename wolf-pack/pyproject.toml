[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wolfpack-cbom"
version = "1.1.0"
description = "Cryptographic inventory (CycloneDX 1.6 CBOM) and post-quantum migration planner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
dev = ["jsonschema>=4.18", "referencing>=0.30"]

[project.scripts]
wolfpack = "wolfpack.cli:main"

[tool.setuptools.packages.find]
include = ["wolfpack*"]

[tool.pytest.ini_options]
pythonpath = ["."]
