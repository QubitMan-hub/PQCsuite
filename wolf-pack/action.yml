# Old path, kept through Acxelin Readiness 1.x: it scans and fails like before. Move to QubitMan-hub/PQCsuite/products/readiness.
name: Acxelin Readiness (old path)
description: Deprecated path of the Acxelin Readiness action
inputs:
  path: {default: "."}
  fail-on: {default: ""}
  baseline: {default: ""}
  args: {default: ""}
  output: {default: readiness-out}
runs:
  using: composite
  steps:
    - shell: bash
      env: {SCAN_PATH: "${{ inputs.path }}", FAIL_ON: "${{ inputs.fail-on }}", BASELINE: "${{ inputs.baseline }}", ARGS: "${{ inputs.args }}", OUT: "${{ inputs.output }}"}
      run: |
        echo "::warning::QubitMan-hub/PQCsuite/wolf-pack is the old path of this action; use QubitMan-hub/PQCsuite/products/readiness"
        pip install --quiet "$GITHUB_ACTION_PATH/../core" "$GITHUB_ACTION_PATH/../products/readiness"
        acxelin-readiness scan "$SCAN_PATH" -o "$OUT" ${FAIL_ON:+--fail-on "$FAIL_ON"} ${BASELINE:+--baseline "$BASELINE"} $ARGS
