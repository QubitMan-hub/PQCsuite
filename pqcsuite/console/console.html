<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acxelin PQC Suite console</title>
<style>
:root {
  --bg: #faf9f5; --panel: #ffffff; --sunken: #f4f1e8; --ink: #2e3c4e; --ink-2: #3f4c59; --mute: #6b7680; --line: #e6e0d2;
  --accent: #ffbf00; --accent-ink: #111111; --accent-text: #9c6f00; --accent-wash: #fff6dc; --focus: #1a73e8;
  --ok: #26734d; --warn: #9c6f00; --bad: #b3431f;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; --sans: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #141a22; --panel: #1b232d; --sunken: #212b37; --ink: #eef0f2; --ink-2: #c9ced5; --mute: #8e98a4;
    --line: #2d3947; --accent-text: #ffcf4d; --accent-wash: #2a2616; --focus: #7fb0ff; --ok: #5ccf8e; --warn: #f2c14e; --bad: #f2877b; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #141a22; --panel: #1b232d; --sunken: #212b37; --ink: #eef0f2; --ink-2: #c9ced5; --mute: #8e98a4;
  --line: #2d3947; --accent-text: #ffcf4d; --accent-wash: #2a2616; --focus: #7fb0ff; --ok: #5ccf8e; --warn: #f2c14e; --bad: #f2877b; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--ink); }
.logo { display: block; width: 150px; height: auto; color: var(--ink); }
.shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
nav { background: var(--panel); border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
nav .brand { padding: 0 10px 20px; display: grid; gap: 8px; }
nav .brand small { color: var(--mute); font-size: 12px; letter-spacing: .02em; }
nav .group { margin: 16px 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
nav a { padding: 8px 10px; border-radius: 7px; color: var(--ink-2); text-decoration: none; transition: background .15s, color .15s; }
nav a:hover { background: var(--sunken); color: var(--ink); }
nav a[aria-current="page"] { background: var(--accent-wash); color: var(--ink); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
nav .foot { margin-top: auto; padding: 16px 10px 0; color: var(--mute); font-size: 12px; display: grid; gap: 8px; }
main { padding: 32px 36px 56px; min-width: 0; max-width: 1280px; }
.kicker { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-text); }
h1 { font-size: 26px; font-weight: 500; margin: 0 0 6px; letter-spacing: -0.015em; line-height: 1.2; }
.sub { color: var(--mute); margin: 0 0 26px; max-width: 72ch; font-size: 15px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 24px; }
.tile { display: grid; gap: 4px; align-content: start; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 18px; text-decoration: none; color: inherit; position: relative; transition: border-color .15s, box-shadow .15s, transform .15s; }
a.tile:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 12px 26px -20px rgba(20, 26, 34, .55); }
a.tile::after { content: "\2192"; position: absolute; top: 14px; right: 16px; color: var(--mute); transition: color .15s, transform .15s; }
a.tile:hover::after { color: var(--accent-text); transform: translateX(2px); }
.tile span { color: var(--mute); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; }
.tile b { display: block; font: 600 30px/1.15 var(--sans); letter-spacing: -0.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
.tile small { color: var(--ink-2); font-size: 13px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 18px; overflow: hidden; }
.panel h2 { font-size: 14px; font-weight: 600; margin: 0; padding: 13px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th, td { text-align: left; padding: 10px 18px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; color: var(--mute); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; background: var(--sunken); }
tbody tr:hover td { background: var(--sunken); }
tr:last-child td { border-bottom: 0; }
td.mono, .mono { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { white-space: nowrap; display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: 12px; font-weight: 600; background: color-mix(in srgb, currentColor 13%, transparent); }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .mute { color: var(--mute); }
form.row { display: flex; flex-wrap: wrap; gap: 12px; padding: 16px 18px; align-items: end; }
label { display: grid; gap: 5px; font-size: 12px; font-weight: 500; color: var(--mute); }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; transition: border-color .15s; }
input:hover, select:hover, textarea:hover { border-color: var(--mute); }
textarea { width: 100%; min-height: 90px; font-family: var(--mono); font-size: 12.5px; }
button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; transition: box-shadow .15s; }
button:hover { box-shadow: 0 3px 0 #e5a500; }
button.quiet { background: transparent; color: var(--ink-2); border: 1px solid var(--line); font-weight: 500; }
button.quiet:hover { box-shadow: none; border-color: var(--mute); color: var(--ink); }
button:disabled { opacity: .55; cursor: default; box-shadow: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.notice { padding: 11px 18px; font-size: 13px; }
.empty { padding: 22px 18px; color: var(--mute); }
.login { max-width: 420px; margin: 12vh auto; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 12px; padding: 28px; display: grid; gap: 14px; }
.login h1 { font-size: 22px; }
.steps { list-style: none; margin: 0; padding: 6px 18px 18px; display: grid; gap: 0; counter-reset: step; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.steps li:last-child { border-bottom: 0; }
.steps li::before { content: counter(step); grid-row: span 3; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-wash); color: var(--accent-text); font-weight: 600; font-size: 13px; }
.steps b { font-weight: 600; }
.steps p { margin: 0; color: var(--ink-2); }
pre { margin: 6px 0 0; padding: 10px 12px; background: #26313c; color: #f4efe2; border-radius: 8px; font: 12.5px/1.6 var(--mono); overflow-x: auto; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.cols > div { padding: 14px 18px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.cols code { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
.cols span { color: var(--ink-2); }
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  nav { position: static; height: auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 12px; }
  nav a { white-space: nowrap; }
  nav .brand, nav .foot, nav .group { display: none; }
  main { padding: 22px 16px 40px; }
}
</style>

-.817 3.494-1.226 5.444-1.226 2.133 0 4.243.522 6.33 1.566 2.086 1.043 3.742 2.654 4.966 4.83 1.089-1.723 2.586-3.22 4.492-4.49 1.905-1.27 4.128-1.906 6.668-1.906ZM367.072 57.256c-.907 0-1.747.136-2.518.408-.771.227-1.383.613-1.837 1.157-.453.5-.68 1.202-.68 2.11 0 1.315.431 2.245 1.293 2.79a5.603 5.603 0 0 0 2.858.749c1.315 0 2.518-.273 3.606-.818a7.094 7.094 0 0 0 2.722-2.449c.681-1.043 1.021-2.223 1.021-3.539v-.408h-6.465Z" fill="#FFBF00"/><path d="M288.078 36.791c-5.507 1.376-9.586 6.357-9.586 12.29 0 6.996 5.671 12.668 12.667 12.668 1.932 0 3.762-.434 5.401-1.208l7.63 7.592a22.973 22.973 0 0 1-13.031 4.03c-12.748 0-23.081-10.335-23.081-23.082 0-11.702 8.709-21.369 20-22.875v10.585Z" fill="#2E5BFF"/><path d="M315.237 71.923h-10.968l-16.257-16.087h10.968l16.257 16.087Z" fill="#FFBF00"/><path fill-rule="evenodd" clip-rule="evenodd" d="M301.846 69.541a22.917 22.917 0 0 1-8.118 2.48V61.486c.353-.072.7-.16 1.041-.262l7.077 8.317Z" fill="#FFBF00"/></g><defs><clipPath id="logo-a"><path fill="#fff" d="M0 0h536.776v83H0z"/></clipPath><clipPath id="logo-b"><path fill="#fff" d="M0 0h259v83H0z"/></clipPath><radialGradient id="logo-c" cx="0" cy="0" r="1" gradientTransform="matrix(-.8935 7.74501 -7.74458 -.89266 212.092 14.82)" gradientUnits="userSpaceOnUse"><stop offset=".163" stop-color="#FFD900"/><stop offset="1" stop-color="#FFD900" stop-opacity="0"/></radialGradient></defs></svg></template>
<div id="app"></div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NAV = [["", { overview: "Overview" }], ["Products", { edges: "TLS 1.3 edges", certificates: "Certificates", vpn: "IPsec VPN", backups: "Vault", readiness: "Readiness" }],
  ["Also from Acxelin", { wolfpack: "Wolf Pack CBOM" }]];
const VIEWS = Object.assign({}, ...NAV.map(([, v]) => v));
const logo = () => $("#logo").innerHTML;
let token = null;
try { token = sessionStorage.getItem("pqc-token"); } catch (e) {}

async function api(path, body) {
  const r = await fetch("/api/" + path, { method: body ? "POST" : "GET", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { token = null; try { sessionStorage.removeItem("pqc-token"); } catch (e) {} ; login("That token was not accepted."); throw new Error("unauthorised"); }
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function login(message) {
  $("#app").innerHTML = `<form class="login" id="login">${logo()}<h1>PQC Suite console</h1>
    <p class="sub" style="margin:0">Paste the access token printed when the console started (or PQCSUITE_CONSOLE_TOKEN).</p>
    ${message ? `<div class="bad">${esc(message)}</div>` : ""}
    <label>Access token<input id="tok" type="password" autocomplete="off" required></label><button>Open console</button></form>`;
  $("#login").onsubmit = (e) => { e.preventDefault(); token = $("#tok").value.trim(); try { sessionStorage.setItem("pqc-token", token); } catch (x) {} ; shell(); };
}

function shell() {
  $("#app").innerHTML = `<div class="shell"><nav>
    <div class="brand">${logo()}<small>PQC Suite console</small></div>
    ${NAV.map(([g, v]) => (g ? `<div class="group">${g}</div>` : "") + Object.entries(v).map(([k, t]) => `<a href="#${k}" data-view="${k}">${t}</a>`).join("")).join("")}
    <div class="foot"><button class="quiet" id="theme" type="button">Toggle theme</button><button class="quiet" id="logout" type="button">Sign out</button></div>
  </nav><main id="view"></main></div>`;
  $("#logout").onclick = () => { try { sessionStorage.removeItem("pqc-token"); } catch (e) {} ; token = null; login(); };
  $("#theme").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark"; };
  addEventListener("hashchange", route);
  route();
}

let timer = null;
function route() {
  const view = (location.hash.slice(1) in VIEWS) ? location.hash.slice(1) : "overview";
  document.querySelectorAll("nav a").forEach((a) => a.dataset.view === view ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  clearInterval(timer);
  const run = () => RENDER[view]().catch((e) => { if (e.message !== "unauthorised") $("#view").insertAdjacentHTML("afterbegin", `<div class="panel notice bad">${esc(e.message)}</div>`); });
  run();
  timer = setInterval(() => { if (!document.hidden && !["certificates", "readiness", "wolfpack"].includes(view)) run(); }, 10000);
}

const table = (cols, rows, empty) => rows.length ? `<div class="scroll"><table><thead><tr>${cols.map((c) => `<th>${c}</th>`).join("")}</tr></thead>
  <tbody>${rows.map((r) => `<tr>${r.map(cell).join("")}</tr>`).join("")}</tbody></table></div>`
  : `<div class="empty">${esc(empty)}</div>`;
const cell = (c) => c && typeof c === "object" ? ("html" in c ? `<td>${c.html}</td>` : `<td class="mono">${esc(c.mono)}</td>`) : `<td>${esc(c)}</td>`;
const pill = (text, cls) => ({ html: `<span class="pill ${cls}">${esc(text)}</span>` });
const bytes = (n) => n > 1e9 ? (n / 1e9).toFixed(1) + " GB" : n > 1e6 ? (n / 1e6).toFixed(1) + " MB" : n > 1e3 ? (n / 1e3).toFixed(1) + " kB" : n + " B";
const head = (title, sub, kicker = "") => `${kicker ? `<p class="kicker">${esc(kicker)}</p>` : ""}<h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p>`;

const RENDER = {
  async overview() {
    const o = await api("overview");
    const c = o.certificates, e = o.edges, v = o.vpn, b = o.backups, r = o.readiness;
    const tile = (label, value, note, cls = "", view = "") => `<a class="tile" href="#${view}"><span>${label}</span><b class="${cls}">${esc(value)}</b><small>${esc(note)}</small></a>`;
    $("#view").innerHTML = head("Overview", `${o.product} ${o.version}. Every tile opens its page; figures refresh every 10 seconds.`, "PQC Suite") + `<div class="tiles">
      ${c.error ? tile("Certificates", "–", c.error, "", "certificates") : tile("Certificates", c.valid, `${c.expiring_30d} expire within 30 days, ${c.revoked} revoked`, c.expiring_30d ? "warn" : "", "certificates")}
      ${tile("Edges", e.routes, `${e.active} open connections, ${e.handshakes} handshakes, ${e.failed} refused${e.unreachable ? `, ${e.unreachable} unreachable` : ""}`, e.unreachable ? "warn" : "", "edges")}
      ${tile("Remote users", `${v.remote_online}/${v.remote_users}`, v.remote_users ? "handshake in the last 3 minutes" : "no gateways or users", v.remote_users ? "ok" : "", "vpn")}
      ${tile("VPN tunnels", `${v.quantum_safe}/${v.tunnels}`, v.tunnels ? "up with ML-KEM and a PPK" : "no tunnels connected", !v.tunnels ? "" : v.quantum_safe < v.tunnels ? "bad" : "ok", "vpn")}
      ${tile("Backups", b.count, b.latest ? `latest ${b.latest.slice(0, 16).replace("T", " ")}, ${b.signed} signed` : "none found", "", "backups")}
      ${tile("Readiness", r ? `${r.pq_key_exchange}/${r.endpoints}` : "–", r ? "endpoints offer post-quantum key exchange" : "run a scan on the Readiness page", r && r.pq_key_exchange < r.endpoints ? "warn" : "", "readiness")}
    </div>`;
  },

  async certificates() {
    const d = await api("certificates");
    const statusPill = (c) => c.status === "revoked" ? pill("revoked", "bad") : c.days_left < 0 ? pill("expired", "bad") : c.days_left <= 30 ? pill(`${c.days_left} days`, "warn") : pill("valid", "ok");
    $("#view").innerHTML = head("Certificates", `Root: ${d.root.subject}, ML-DSA, valid until ${d.root.expires}.`, "TLS 1.3 + mTLS") +
      `<div class="panel"><h2>Issue a certificate</h2><form class="row" id="issue">
        <label>Kind<select name="kind"><option value="server">server</option><option value="client">client</option><option value="site">site (VPN gateway)</option></select></label>
        <label>Common name<input name="common_name" required placeholder="api.acme.example"></label>
        <label>Other names<input name="names" placeholder="10.0.0.5, api.internal"></label>
        <label>Days<input name="days" type="number" value="397" min="1" style="width:90px"></label>
        <button>Issue</button><span id="issued" class="mute"></span></form></div>
      <div class="panel"><h2>Issued certificates <button class="quiet" id="maintain" type="button" style="float:right;margin-top:-5px">Renew expiring and refresh CRL</button></h2>
      ${table(["Serial", "Name", "Kind", "Key", "Expires", "Status", ""], d.certificates.slice().reverse().map((c) => [{ mono: c.serial.slice(0, 16) }, c.common_name + (c.names.length ? ` (${c.names.join(", ")})` : ""),
        c.kind, { mono: c.algorithm }, { mono: c.not_after.slice(0, 10) }, statusPill(c),
        c.status === "valid" ? { html: `<button class="quiet" data-revoke="${esc(c.serial)}" data-name="${esc(c.common_name)}" type="button">Revoke</button>` } : ""]), "No certificates yet.")}</div>`;
    $("#issue").onsubmit = async (e) => { e.preventDefault(); const f = new FormData(e.target);
      try { const r = await api("certificates/issue", Object.fromEntries(f)); await RENDER.certificates(); $("#issued").textContent = `Issued ${r.serial.slice(0, 16)}; key and certificate are in ${r.folder}`; }
      catch (x) { $("#issued").textContent = x.message; } };
    $("#maintain").onclick = async () => { const r = await api("certificates/maintain", {}); await RENDER.certificates();
      $("#issued").textContent = `Renewed ${r.renewed.length ? r.renewed.join(", ") : "nothing"}${r.skipped.length ? `; renew by hand: ${r.skipped.join(", ")}` : ""}. CRL re-signed.`; };
    document.querySelectorAll("[data-revoke]").forEach((b) => b.onclick = async () => {
      if (b.dataset.confirm !== "yes") { b.dataset.confirm = "yes"; b.textContent = `Confirm: revoke ${b.dataset.name}`; b.classList.remove("quiet"); return; }
      await api("certificates/revoke", { serial: b.dataset.revoke, reason: "unspecified" }); await RENDER.certificates(); });
  },

  async edges() {
    const rows = await api("edges");
    $("#view").innerHTML = head("Edges", "Post-quantum TLS in front of your services, read from each edge's /status endpoint.", "TLS 1.3 + mTLS") + `<div class="panel">${table(
      ["Edge", "Mode", "Listen → target", "Policy", "Open", "Handshakes", "Refused", "Key exchange"],
      rows.map((e) => e.error ? [e.source, pill("unreachable", "bad"), { html: `<span class="mute">${esc(e.error)}</span>` }, "", "", "", "", ""]
        : [e.name, e.mode, { mono: `${e.listen} → ${e.target}` }, pill(e.policy, e.policy === "strict" ? "ok" : "warn"), e.active, e.handshakes || 0,
           e.handshake_failed || 0, Object.entries(e.groups || {}).map(([g, n]) => `${g} ×${n}`).join(", ") || "–"]),
      "No edges configured. Start the console with --edge http://HOST:PORT (an edge's metrics address).")}</div>`;
  },

  async vpn() {
    const remote = async () => {
      const users = await api("remote"), now = Date.now() / 1000;
      return `<div class="panel"><h2>Remote access: WireGuard, pre-shared key from ML-DSA mutual TLS, replaced every few minutes</h2>${table(
        ["User", "Address", "Last handshake", "Key age", "Traffic in / out"],
        users.map((u) => u.error ? [u.source, pill("unreachable", "bad"), { html: `<span class="mute">${esc(u.error)}</span>` }, "", ""]
          : [u.user, { mono: u.address }, u.latest_handshake ? pill(Math.round(now - u.latest_handshake) + " s ago", now - u.latest_handshake < 180 ? "ok" : "warn") : pill("never", "warn"),
             { mono: u.keys_age_s + " s" }, { mono: `${bytes(u.rx_bytes || 0)} / ${bytes(u.tx_bytes || 0)}` }]),
        "No gateways. Start the console with --wireguard http://HOST:PORT (a gateway's metrics address).")}</div>`;
    };
    const rows = await api("tunnels");
    $("#view").innerHTML = head("VPN", "Site-to-site IPsec: hybrid ML-KEM key exchange with PSK and PPK from ML-DSA mutual TLS.", "IPsec VPN") + `<div class="panel">${table(
      ["Peer", "State", "Key exchange", "PPK", "Up", "Traffic in / out"],
      rows.map((t) => t.error ? [t.source, pill("unreachable", "bad"), { html: `<span class="mute">${esc(t.error)}</span>` }, "", "", ""]
        : [t.peer, pill(t.state, t.state === "ESTABLISHED" ? "ok" : "warn"), { mono: t.key_exchange }, t.ppk ? pill("yes", "ok") : pill("no", "bad"),
           { mono: Math.round(t.established_s / 60) + " min" }, { mono: t.children.map((c) => `${bytes(c.bytes_in)} / ${bytes(c.bytes_out)}`).join(", ") || "–" }]),
      "No tunnels. Start the console with --vici unix:///var/run/charon.vici.")}</div>` + await remote();
  },

  async backups() {
    const rows = await api("backups");
    $("#view").innerHTML = head("Backups", "Vault archives: X25519 + ML-KEM-768 per recipient, AES-256-GCM, optional ML-DSA signature.", "Vault") + `<div class="panel">${table(
      ["File", "Created", "Kind", "Recipients", "Signed by", "Size"],
      rows.map((b) => b.error ? [{ mono: b.file }, pill("unreadable", "bad"), b.error, "", "", ""]
        : [{ mono: b.file.split(/[\\/]/).pop() }, { mono: b.created.slice(0, 16).replace("T", " ") }, b.kind, b.recipients.length,
           b.signed_by ? pill(b.signed_by.replace("CN=", ""), "ok") : pill("unsigned", "warn"), { mono: bytes(b.size) }]),
      "No backups found. Start the console with --backups FOLDER.")}</div>`;
  },

  async wolfpack() {
    $("#view").innerHTML = head("Wolf Pack CBOM", "Finds the cryptography in your code, configuration, keys, binaries and dependencies, writes a CycloneDX 1.6 inventory, and ranks what to migrate first. It is a separate tool: it runs where your code is, and your code never comes to this console.", "Also from Acxelin") +
      `<div class="panel"><h2>Scan a repository</h2><ol class="steps">
        <li><b>Install it</b><p>Python 3.11 or newer, from the wolf-pack folder of the PQC Suite repository.</p><pre>pip install ./wolf-pack</pre></li>
        <li><b>Scan a folder</b><p>Add the endpoints you want probed as well; nothing else is contacted.</p><pre>wolfpack scan ./payments-api --tls api.example.com:443</pre></li>
        <li><b>Keep it in CI</b><p>Findings become code scanning alerts, and the build stops on new critical ones.</p><pre>- uses: QubitMan-hub/PQCsuite/wolf-pack@main
  with:
    fail-on: critical</pre></li></ol></div>
      <div class="panel"><h2>Every scan writes</h2><div class="cols">
        <div><code>cbom.json</code><span>The inventory, in CycloneDX 1.6</span></div>
        <div><code>report.html</code><span>The migration list, to open offline or forward</span></div>
        <div><code>wolfpack.sarif</code><span>Findings for GitHub code scanning</span></div>
        <div><code>findings.json</code><span>Everything, including what was rejected and why</span></div></div></div>`;
  },

  async readiness() {
    const s = await api("scan");
    const grade = { A: "ok", B: "ok", C: "bad", F: "mute" };
    $("#view").innerHTML = head("Readiness", "Which endpoints offer post-quantum key exchange, and with which certificates.", "Readiness assessment") +
      `<div class="panel"><h2>Scan</h2><form id="scan" style="padding:14px 16px;display:grid;gap:10px">
        <label>Endpoints, one per line (host:port)<textarea name="targets">${esc((s.targets || []).join("\n"))}</textarea></label>
        <div><button ${s.running ? "disabled" : ""}>${s.running ? "Scanning…" : "Scan"}</button> <span class="mute" id="scanmsg"></span></div></form></div>` +
      (s.last ? `<div class="panel"><h2>${s.last.summary.pq_key_exchange}/${s.last.summary.endpoints} offer post-quantum key exchange, ${s.last.summary.pq_certificates} use ML-DSA certificates</h2>${table(
        ["Grade", "Endpoint", "Negotiated", "Accepted", "Certificate", "Expires"],
        s.last.endpoints.slice().sort((a, b) => a.grade.localeCompare(b.grade)).map((r) => [pill(r.grade, grade[r.grade]), { mono: r.target }, r.negotiated || r.error || "",
          r.accepts.join(", "), (r.certificate || {}).key || "", { mono: (r.certificate || {}).expires || "" }]), "")}</div>` : "");
    $("#scan").onsubmit = async (e) => { e.preventDefault();
      try { await api("scan", { targets: new FormData(e.target).get("targets") }); } catch (x) { $("#scanmsg").textContent = x.message; return; }
      const poll = setInterval(async () => { const t = await api("scan"); if (!t.running) { clearInterval(poll); RENDER.readiness(); } }, 1500);
      RENDER.readiness(); };
  },
};

token ? shell() : login();
</script>
</body>
</html>
