name: Acxelin VPN installer
description: Build this runner's Acxelin VPN installer (Windows Setup, macOS disk image or Linux package), install it, and check the installed app. Leaves it in dist/installers.
runs:
  using: composite
  steps:
    - run: pip install ".[desktop]" pyinstaller==6.22.3 || { echo "::error title=Acxelin VPN installer::pip install failed"; exit 1; }
      shell: bash
    - name: OpenSSL 3.5 to ship inside the Linux package (the VPN job's cached build, read only)
      if: runner.os == 'Linux'
      id: openssl
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /opt/pqc
        key: openssl-3.5.9-strongswan-6.1.0-v2
    - name: Build OpenSSL 3.5 when that cache is empty
      if: runner.os == 'Linux' && steps.openssl.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL -o openssl.tgz https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz
        echo "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  openssl.tgz" | sha256sum -c -
        tar xzf openssl.tgz && cd openssl-3.5.9 && ./Configure --prefix=/opt/pqc --libdir=lib shared no-tests && make -j4 && sudo make install_sw
    - name: Build, install and check the Linux package
      if: runner.os == 'Linux'
      shell: bash
      run: |
        LD_LIBRARY_PATH=/opt/pqc/lib python packaging/build.py
        sudo apt-get update && sudo apt-get install -y ./dist/installers/acxelin-vpn_*.deb
        python packaging/build.py smoke /usr/bin/acxelin-vpn
    - name: Build, install and check the Windows installer
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        $log = choco upgrade openssl innosetup -y --no-progress 2>&1 | Out-String
        if ($LASTEXITCODE -notin 0, 3010) { Write-Output "::error title=Acxelin VPN installer::choco failed ($LASTEXITCODE): $((($log -split "`n") | Select-Object -Last 8) -join ' | ')"; exit 1 }
        $ssl = Get-ChildItem "$env:ProgramFiles\OpenSSL*\bin\libssl-3-x64.dll", "$env:ProgramFiles\OpenSSL*\libssl-3-x64.dll" -ErrorAction SilentlyContinue | Sort-Object { [version]($_.VersionInfo.ProductVersion -replace '[^0-9.].*', '') } -Descending | Select-Object -First 1
        if (-not $ssl) { Write-Output "::error title=Acxelin VPN installer::no libssl-3-x64.dll under $env:ProgramFiles\OpenSSL*"; exit 1 }
        Write-Output "::notice title=Acxelin VPN installer::bundling OpenSSL $($ssl.VersionInfo.ProductVersion) from $($ssl.DirectoryName)"
        python packaging/build.py --openssl $ssl.DirectoryName
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $setup = Get-ChildItem dist\installers\Acxelin-VPN-*-Setup.exe
        $install = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=""','/LOG=setup.log' -Wait -PassThru
        if ($install.ExitCode) { Write-Output "::error title=Acxelin VPN installer::Setup exited with $($install.ExitCode)"; Get-Content setup.log -Tail 30; exit 1 }
        python packaging/build.py smoke "$env:ProgramFiles\Acxelin VPN\acxelin-vpn.exe"
    - name: Build, install and check the macOS disk image
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install openssl@3
        python packaging/build.py --openssl "$(brew --prefix openssl@3)/lib"
        hdiutil attach dist/installers/Acxelin-VPN-*.dmg -mountpoint /Volumes/AcxelinVPN -nobrowse
        ditto "/Volumes/AcxelinVPN/Acxelin VPN.app" "/Applications/Acxelin VPN.app"
        hdiutil detach /Volumes/AcxelinVPN
        python packaging/build.py smoke "/Applications/Acxelin VPN.app/Contents/MacOS/acxelin-vpn"
