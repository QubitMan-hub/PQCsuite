version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/products/readiness"]
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories: ["/", "/core", "/products/tls", "/products/vpn", "/products/readiness"]
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/", "/products/tls/deploy", "/products/vpn/deploy", "/products/readiness/deploy"]
    schedule:
      interval: weekly
