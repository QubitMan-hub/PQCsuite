name: soak
on:
  schedule:
    - cron: "23 2 * * 0"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to run"
        default: "120"
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    container: python:3.13-slim-trixie@sha256:7c61056e61ac89e852de05f3dc6fa51a6dd2181797bceed46aa725dd7cb2cd3b
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install .
      - name: The edge under steady change (revocations, renewals, clients); memory, files and threads must stay flat
        env:
          MINUTES: ${{ inputs.minutes || '120' }}
        run: python scripts/soak.py --minutes "$MINUTES" --out soak.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak
          path: soak.json
