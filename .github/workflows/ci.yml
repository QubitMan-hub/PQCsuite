name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: python -m unittest discover -s tests -v
  tls:
    runs-on: ubuntu-latest
    container: python:3.13-slim-trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Real applications for the scenario tests
        run: |
          apt-get update && apt-get install -y --no-install-recommends openssl curl nginx postgresql redis-server redis-tools \
            mosquitto mosquitto-clients openssh-server
      - run: pip install -e ".[test]" && pqcsuite doctor
      - run: python -m unittest discover -s tests -v
      - run: python examples/clinic_demo.py --auto
      - run: python examples/bank_demo.py --auto
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Known vulnerabilities in the runtime and optional dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit .
          printf 'vici>=6.0\nboto3>=1.35\n' > extras.txt && pip-audit -r extras.txt
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t pqcsuite:ci . && docker run --rm pqcsuite:ci doctor
  vpn:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Cache OpenSSL 3.5 and strongSwan 6.1
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/pqc
          key: openssl-3.5.4-strongswan-6.1.0-v1
      - name: Build OpenSSL 3.5 and strongSwan 6.1
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libgmp-dev pkg-config
          curl -fsSL https://github.com/openssl/openssl/releases/download/openssl-3.5.4/openssl-3.5.4.tar.gz | tar xz
          (cd openssl-3.5.4 && ./Configure --prefix=/opt/pqc --libdir=lib shared no-tests && make -j4 && sudo make install_sw)
          curl -fsSL https://github.com/strongswan/strongswan/releases/download/6.1.0/strongswan-6.1.0.tar.bz2 | tar xj
          cd strongswan-6.1.0 && PKG_CONFIG_PATH=/opt/pqc/lib/pkgconfig CPPFLAGS=-I/opt/pqc/include LDFLAGS="-L/opt/pqc/lib -Wl,-rpath,/opt/pqc/lib" \
            ./configure --prefix=/opt/pqc --disable-defaults --enable-openssl --enable-ml --enable-vici --enable-swanctl --enable-charon \
            --enable-ikev2 --enable-pem --enable-pkcs1 --enable-pkcs8 --enable-x509 --enable-pubkey --enable-random --enable-nonce --enable-hmac \
            --enable-kdf --enable-kernel-netlink --enable-socket-default --enable-updown --enable-resolve --enable-attr --enable-constraints \
            --enable-revocation && make -j4 && sudo make install && sudo chmod -R a+rX /opt/pqc
      - run: pip install -e ".[vpn]"
      - name: Two sites in network namespaces, real ESP traffic
        run: |
          sudo modprobe -a esp4 xfrm_user || true
          sudo -E env "PATH=$PATH" LD_LIBRARY_PATH=/opt/pqc/lib PQCSUITE_STRONGSWAN=/opt/pqc PQCSUITE_VPN_DATAPLANE=1 \
            python -m unittest tests.test_vpn tests.test_tls -v
      - name: WireGuard remote access in network namespaces, real traffic
        run: |
          set -o pipefail
          sudo apt-get install -y wireguard-tools
          sudo modprobe wireguard || true
          sudo -E env "PATH=$PATH" LD_LIBRARY_PATH=/opt/pqc/lib python -m unittest tests.test_wireguard -v 2>&1 | tee wg.log
          grep -q "test_traffic_rotation_and_revocation .* ok" wg.log
      - name: VPN demo (branch over IPsec, laptop over WireGuard)
        run: sudo -E env "PATH=$PATH" LD_LIBRARY_PATH=/opt/pqc/lib PQCSUITE_STRONGSWAN=/opt/pqc python examples/vpn_demo.py --auto
  kubernetes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cluster and image
        run: |
          kind create cluster --wait 120s
          docker build -t pqcsuite:ci . && kind load docker-image pqcsuite:ci
          helm lint --strict deploy/helm/pqcsuite
      - name: Install the CA
        run: helm install pqc deploy/helm/pqcsuite --set image.repository=pqcsuite --set image.tag=ci --set image.pullPolicy=Never --wait --timeout 240s
      - name: Issue an edge certificate in the cluster and put the edge in front of a web app
        run: |
          kubectl create deployment web --image=pqcsuite:ci -- python -m http.server 8080 --directory /tmp
          kubectl expose deployment web --port 80 --target-port 8080
          ca() { kubectl exec pqc-ca-0 -c maintain -- "$@"; }
          ca pqcsuite ca issue --dir /data/pki server pqc-edge.default.svc --san pqc-edge --out /data/issued/edge
          mkdir edge && for f in chain.pem key.pem; do ca cat /data/issued/edge/$f > edge/$f; done && ca cat /data/pki/ca.crt > edge/ca.crt
          kubectl create secret generic edge-tls --from-file=edge/
          helm upgrade pqc deploy/helm/pqcsuite --reuse-values --set edge.enabled=true --set 'edge.routes[0].name=web' \
            --set 'edge.routes[0].port=8443' --set 'edge.routes[0].target=web:80' --wait --timeout 180s
      - name: Post-quantum request through the edge
        run: |
          kubectl cp deploy/k8s/smoke.py pqc-ca-0:/data/smoke.py -c maintain
          kubectl exec pqc-ca-0 -c maintain -- python /data/smoke.py pqc default
      - name: Diagnostics
        if: failure()
        run: kubectl get pods -A; kubectl describe pods; kubectl logs -l app.kubernetes.io/instance=pqc --all-containers --tail 100
  cloud-image:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Packer template
        run: |
          apt-get update && apt-get install -y curl unzip sudo
          curl -fsSL -o packer.zip https://releases.hashicorp.com/packer/1.14.1/packer_1.14.1_linux_amd64.zip && unzip -q packer.zip -d /usr/local/bin
          packer init deploy/packer && packer fmt -check deploy/packer
          packer validate -var gcp_project=ci -var azure_subscription_id=00000000-0000-0000-0000-000000000000 deploy/packer
      - name: The image's provisioning script on Debian 13 (systemctl stubbed; no systemd in a container)
        run: |
          printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/systemctl && chmod +x /usr/local/bin/systemctl
          mkdir -p /tmp/pqcsuite && cp -r pyproject.toml README.md pqcsuite deploy /tmp/pqcsuite/
          sh deploy/packer/provision.sh
          test -x /opt/strongswan/libexec/ipsec/charon && ls /etc/systemd/system/pqcsuite-*.service
