name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python -m wolfpack bench bench/corpus
      - run: python -m wolfpack scan bench/corpus -o wolfpack-out -q
      - run: python scripts/validate_cbom.py wolfpack-out/cbom.json
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip wheel . --no-deps -w dist
      - run: python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
      - run: cd /tmp && /tmp/clean/bin/wolfpack --version && /tmp/clean/bin/wolfpack scan "$GITHUB_WORKSPACE/bench/corpus" -o /tmp/out -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: dist/*.whl
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t wolfpack .
      - run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/bench/corpus:/scan" wolfpack scan . -q
      - run: test -s bench/corpus/wolfpack-out/cbom.json
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          path: bench/corpus
          upload-sarif: "false"
      - id: gate
        uses: ./
        continue-on-error: true
        with:
          path: bench/corpus
          output: gated
          fail-on: critical
          upload-sarif: "false"
      - run: test "${{ steps.gate.outcome }}" = failure
