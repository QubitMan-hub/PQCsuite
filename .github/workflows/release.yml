name: release
on:
  push:
    tags: ["v*", "wolf-pack-v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build the wheel, and for the suite its CBOM
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            wolf-pack-v*) dir=wolf-pack; version="${TAG#wolf-pack-v}" ;;
            *) dir=.; version="${TAG#v}" ;;
          esac
          python scripts/release_notes.py "$dir" "$version" > notes.md
          pip wheel "./$dir" --no-deps -w dist
          if [ "$dir" = . ]; then
            pip install ./wolf-pack
            wolfpack scan pqcsuite -o cbom -q
            cp cbom/cbom.json "dist/pqcsuite-$version-cbom.json"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
