name: acxelin-tls
on:
  push:
    paths:
      - "products/tls/**"
      - ".github/workflows/acxelin-tls.yml"
      - "core/**"
      - "tools/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - "products/tls/**"
      - ".github/workflows/acxelin-tls.yml"
      - "core/**"
      - "tools/**"
      - ".github/actions/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: OpenSSL 3.5+ (Homebrew on macOS, Chocolatey on Windows; Linux runs the Debian 13 job for the full TLS suite)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install openssl@3 && echo "ACXELIN_OPENSSL=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"; fi
          if [ "$RUNNER_OS" = Windows ]; then choco install openssl -y --no-progress && echo "ACXELIN_OPENSSL=C:\\Program Files\\OpenSSL-Win64\\bin" >> "$GITHUB_ENV"; fi
      - name: A second loopback address, as Linux has, for the per-host limit test
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - run: pip install ./core "./products/tls[test]"
      - run: acxelin-tls doctor
      - name: Playwright's Chromium and axe-core, for the console and website journeys
        shell: bash
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          npm ci --prefix tools/browser
      - name: Tests, the browser journeys and the clean-wheel install
        run: python -m pytest -q products/tls/tests
        env: {ACXELIN_INSTALL_TEST: "1"}
  linux-openssl-3-5:
    # Debian 13's system OpenSSL is 3.5, so every TLS test runs here instead of being skipped
    runs-on: ubuntu-latest
    container: python:3.13-slim-trixie@sha256:7c61056e61ac89e852de05f3dc6fa51a6dd2181797bceed46aa725dd7cb2cd3b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y --no-install-recommends procps git
      - run: pip install ./core "./products/tls[test]"
      - run: acxelin-tls doctor
      - run: python -m pytest -q products/tls/tests --ignore=products/tls/tests/browser
        env: {ACXELIN_INSTALL_TEST: "1"}
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx run ruff==0.14.0 check core products/tls tools
