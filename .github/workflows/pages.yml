name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/PRODUCT-MANUAL.md", "scripts/manual.py", "pqcsuite/brand.py", "pqcsuite/console/console.html", "pqcsuite/__init__.py", "wolf-pack/wolfpack/**", "wolf-pack/pyproject.toml", "examples/wolfpack-sample/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Generate sample reports with this commit's scanner
        run: |
          pip install . './wolf-pack[crawler]' markdown-it-py==4.2.0
          python examples/wolfpack-sample/make_report.py
          python scripts/manual.py
      - name: The site with its public address stamped in (change it here when the site moves)
        run: python3 site/publish.py https://qubitman-hub.github.io/PQCsuite/ dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
