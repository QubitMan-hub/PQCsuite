name: acxelin-readiness
on:
  push:
    paths:
      - "products/readiness/**"
      - ".github/workflows/acxelin-readiness.yml"
      - "core/**"
      - "tools/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - "products/readiness/**"
      - ".github/workflows/acxelin-readiness.yml"
      - "core/**"
      - "tools/**"
      - ".github/actions/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ./core "./products/readiness[test,crawler]"
      - run: acxelin-readiness doctor
      - name: Playwright's Chromium and axe-core, for the console and website journeys
        shell: bash
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          npm ci --prefix tools/browser
      - name: Tests, the browser journeys and the clean-wheel install
        run: python -m pytest -q products/readiness/tests
        env: {ACXELIN_INSTALL_TEST: "1"}
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx run ruff==0.14.0 check core products/readiness tools
